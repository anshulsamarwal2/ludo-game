<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Ludo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0ecfb;
  --card:#fff;--card2:#f8f5ff;--border:#e4ddf0;
  --text:#1a1a2e;--muted:#888;
  --shadow:0 2px 10px rgba(0,0,0,.09);
  --shadow-md:0 4px 18px rgba(0,0,0,.13);
  /* player colours */
  --red:#e53935;--red-l:#ffcdd2;--red-t:rgba(229,57,53,.13);
  --blue:#1e88e5;--blue-l:#bbdefb;--blue-t:rgba(30,136,229,.13);
  --green:#43a047;--green-l:#c8e6c9;--green-t:rgba(67,160,71,.13);
  --yellow:#f9a825;--yellow-l:#fff9c4;--yellow-t:rgba(249,168,37,.13);
  /* board zone colours (classic Ludo) */
  --zr:#e53935;--zb:#1e88e5;--zg:#43a047;--zy:#fdd835;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── SCREENS ── */
.scr{display:none;width:100%;max-width:520px;margin:0 auto;padding:18px 12px 36px;flex-direction:column;align-items:center;gap:12px;animation:fadeUp .3s ease}
.scr.on{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── MENU ── */
#menu{min-height:100vh;justify-content:center;padding-top:32px}
.logo-t{font-size:4rem;font-weight:900;letter-spacing:-3px;text-align:center;
  background:linear-gradient(135deg,var(--red),var(--yellow),var(--green),var(--blue));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.logo-s{text-align:center;font-size:.65rem;font-weight:800;letter-spacing:4px;text-transform:uppercase;color:var(--muted);margin-top:3px}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px 16px;width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow-md)}
.sec{font-size:.62rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:var(--muted)}
.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.mcard{background:var(--card2);border:2px solid var(--border);border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;transition:all .2s cubic-bezier(.34,1.56,.64,1);color:var(--text)}
.mcard:hover{transform:translateY(-3px);border-color:#c5b8e0}
.mcard.sel{border-color:var(--blue);background:var(--blue-t)}
.mcard .mi{font-size:1.8rem;margin-bottom:4px}
.mcard h3{font-size:.82rem;font-weight:800}
.mcard p{font-size:.65rem;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:7px}
.chip{flex:1;padding:9px 0;background:var(--card2);border:2px solid var(--border);border-radius:100px;font-family:'Nunito',sans-serif;font-weight:800;font-size:.93rem;color:var(--text);cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1)}
.chip:hover{transform:scale(1.05)}
.chip.sel{background:var(--blue-t);border-color:var(--blue);color:var(--blue)}
.go{width:100%;padding:15px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--blue),#7c3aed);color:#fff;font-family:'Nunito',sans-serif;font-weight:900;font-size:1.05rem;cursor:pointer;transition:all .2s cubic-bezier(.34,1.56,.64,1);box-shadow:0 6px 18px rgba(30,136,229,.32)}
.go:hover{transform:translateY(-2px) scale(1.01);box-shadow:0 10px 26px rgba(30,136,229,.42)}
.go:active{transform:scale(.97)}
.lnk{background:none;border:none;color:var(--muted);font-family:'Nunito',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--text)}

/* ── GAME ── */
#game{padding:10px 10px 20px;gap:9px}
.topbar{display:flex;justify-content:space-between;align-items:center;width:100%}
.ibtn{width:36px;height:36px;background:var(--card);border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .14s;color:var(--text)}
.ibtn:hover{background:var(--card2);transform:scale(1.08)}
.gtitle{font-size:.95rem;font-weight:900;color:var(--text)}

/* ── STATUS PILL ── */
.spill{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:100px;padding:7px 14px;display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:700;transition:border-color .3s;box-shadow:var(--shadow)}
.sdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;transition:background .3s}
.smsg{color:var(--muted);margin-left:auto;font-size:.72rem}

/* ── PLAYER ROWS (top/bottom of board) ── */
.prow{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}

/* ── PLAYER BOX ── */
.pbox{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:8px 10px;display:flex;align-items:center;gap:8px;transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow)}
.pbox.active{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.pbox.finished{opacity:.65}
.px-info{flex:1;min-width:0}
.px-name{font-size:.72rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.px-score{font-size:.65rem;color:var(--muted);margin-top:1px;font-weight:700}
.px-roll{padding:5px 10px;border-radius:9px;border:none;font-family:'Nunito',sans-serif;font-weight:900;font-size:.7rem;cursor:pointer;letter-spacing:.3px;transition:all .18s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;flex-shrink:0}
.px-roll:disabled{opacity:.3;cursor:not-allowed;transform:none!important}
.px-roll:not(:disabled):hover{transform:scale(1.08)}
.px-roll:not(:disabled):active{transform:scale(.93)}

/* ── DIE (small, in player panel) ── */
.die-sm{width:38px;height:38px;background:#fff;border-radius:8px;display:grid;grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr;padding:5px;gap:3px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.8);flex-shrink:0;transition:transform .14s;border:1.5px solid #e0e0e0}
.die-sm:hover:not(.disabled-die){transform:rotate(6deg) scale(1.1)}
.die-sm.snap{animation:dsnap .2s cubic-bezier(.36,.07,.19,.97)}
@keyframes dsnap{0%{transform:scale(1) rotate(0)}30%{transform:scale(.82) rotate(-14deg)}65%{transform:scale(1.16) rotate(9deg)}100%{transform:scale(1) rotate(0)}}
.die-sm .dot{border-radius:50%;background:var(--text);opacity:0;width:100%;height:100%;transition:opacity .07s}
/* die faces */
.die-sm.face-1 .d5{opacity:1}
.die-sm.face-2 .d3,.die-sm.face-2 .d7{opacity:1}
.die-sm.face-3 .d3,.die-sm.face-3 .d5,.die-sm.face-3 .d7{opacity:1}
.die-sm.face-4 .d1,.die-sm.face-4 .d3,.die-sm.face-4 .d7,.die-sm.face-4 .d9{opacity:1}
.die-sm.face-5 .d1,.die-sm.face-5 .d3,.die-sm.face-5 .d5,.die-sm.face-5 .d7,.die-sm.face-5 .d9{opacity:1}
.die-sm.face-6 .d1,.die-sm.face-6 .d3,.die-sm.face-6 .d4,.die-sm.face-6 .d6,.die-sm.face-6 .d7,.die-sm.face-6 .d9{opacity:1}

/* ── BOARD ── */
.bwrap{width:100%;display:flex;justify-content:center}
.board{position:relative;width:min(460px,calc(100vw - 24px));height:min(460px,calc(100vw - 24px));border-radius:16px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18),0 0 0 2px var(--border)}
.bgrid{display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr);width:100%;height:100%}
.bc{display:flex;align-items:center;justify-content:center;position:relative;font-size:.5rem;transition:filter .15s}
/* Board zones - classic colours */
.zr{background:var(--zr)}.zb{background:var(--zb)}.zg{background:var(--zg)}.zy{background:var(--zy)}
/* Inner home rectangle overlay */
.hb-inner{background:rgba(255,255,255,.32)!important}
/* Token slot circles */
.hb-slot::before{content:'';position:absolute;width:64%;height:64%;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.55)}
/* Regular path — thin black border for cell definition */
.pn{background:#fafafa;outline:1px solid rgba(0,0,0,.18)}
.pa{background:#f0f0f0;outline:1px solid rgba(0,0,0,.18)}
/* SAFE / resting squares — warm gold, star, stronger border */
.psafe{background:#fff8e1;outline:2px solid rgba(249,168,37,.7);z-index:1}
.bc.psafe::after{content:'★';font-size:1em;color:#f9a825;text-shadow:0 0 8px rgba(249,168,37,.9);pointer-events:none;position:absolute}
/* START squares (coloured, safe) — colored border + thin black outline */
.psr{background:rgba(229,57,53,.22);outline:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--red)}
.psb{background:rgba(30,136,229,.22);outline:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--blue)}
.psg{background:rgba(67,160,71,.22);outline:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--green)}
.psy{background:rgba(249,168,37,.22);outline:1px solid rgba(0,0,0,.18);box-shadow:inset 0 0 0 2px var(--yellow)}
/* Home column strips — thin black border */
.hcr{background:#ffcdd2;outline:1px solid rgba(0,0,0,.18)}
.hcb{background:#bbdefb;outline:1px solid rgba(0,0,0,.18)}
.hcg{background:#c8e6c9;outline:1px solid rgba(0,0,0,.18)}
.hcy{background:#fff9c4;outline:1px solid rgba(0,0,0,.18)}
/* Center */
.zcen{background:conic-gradient(var(--zr) 0 25%,var(--zb) 25% 50%,var(--zg) 50% 75%,var(--zy) 75%)}
.zcen-r{background:var(--zr)}.zcen-b{background:var(--zb)}.zcen-g{background:var(--zg)}.zcen-y{background:var(--zy)}
/* Highlight pulse (clickable cell) */
.bc.hi{animation:cpulse .9s ease-in-out infinite;cursor:pointer;z-index:4}
@keyframes cpulse{0%,100%{filter:brightness(1)}50%{filter:brightness(2.2)}}

/* ── TOKENS ── */
#tlayer{position:absolute;inset:0;pointer-events:none;z-index:5}
.token{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.6em;font-weight:900;font-family:'Nunito',sans-serif;border:2px solid rgba(255,255,255,.55);user-select:none;pointer-events:none;
  transition:left .13s cubic-bezier(.4,0,.2,1),top .13s cubic-bezier(.4,0,.2,1),transform .2s,opacity .4s,box-shadow .2s}
.token.movable{pointer-events:all;cursor:pointer;animation:tbounce .65s ease-in-out infinite alternate}
.token.movable:hover{transform:scale(1.38)!important;z-index:20!important}
@keyframes tbounce{from{transform:scale(1) translateY(0);box-shadow:0 3px 10px rgba(0,0,0,.4)}to{transform:scale(1.18) translateY(-3px);box-shadow:0 8px 20px rgba(0,0,0,.5)}}
.token.done-glow{animation:dgl 2.2s ease-in-out infinite}
@keyframes dgl{0%,100%{box-shadow:0 0 6px 2px currentColor}50%{box-shadow:0 0 16px 4px currentColor}}
.tkr{background:radial-gradient(circle at 35% 30%,#ff8fa3,var(--red));color:#fff;box-shadow:0 4px 12px rgba(229,57,53,.5)}
.tkb{background:radial-gradient(circle at 35% 30%,#90c8ff,var(--blue));color:#fff;box-shadow:0 4px 12px rgba(30,136,229,.5)}
.tkg{background:radial-gradient(circle at 35% 30%,#a0e8a8,var(--green));color:#fff;box-shadow:0 4px 12px rgba(67,160,71,.5)}
.tky{background:radial-gradient(circle at 35% 30%,#ffe57a,#f9a825);color:#5a3800;box-shadow:0 4px 12px rgba(249,168,37,.5)}

/* ── CROWN BADGE ── */
.cbadge{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;pointer-events:none;transform:translate(-50%,-50%);animation:crownpop .6s cubic-bezier(.34,1.56,.64,1)}
@keyframes crownpop{from{transform:translate(-50%,-50%) scale(0) rotate(-20deg);opacity:0}to{transform:translate(-50%,-50%) scale(1) rotate(0);opacity:1}}
.cbadge .crank{font-size:.55rem;font-weight:900;letter-spacing:.8px;margin-top:2px;text-shadow:0 1px 4px rgba(0,0,0,.5)}

/* ── WIN OVERLAY ── */
.wov{display:none;position:fixed;inset:0;z-index:50;background:rgba(20,10,50,.8);backdrop-filter:blur(10px);align-items:center;justify-content:center}
.wov.on{display:flex;animation:fIn .3s ease}
@keyframes fIn{from{opacity:0}to{opacity:1}}
.wcard{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 22px;max-width:340px;width:92%;display:flex;flex-direction:column;align-items:center;gap:14px;position:relative;animation:wIn .4s cubic-bezier(.34,1.56,.64,1)}
@keyframes wIn{from{transform:scale(.75) translateY(30px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.wcard .xbtn{position:absolute;top:12px;right:12px;width:28px;height:28px;background:var(--card2);border:1px solid var(--border);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.8rem;color:var(--muted);transition:all .14s}
.wcard .xbtn:hover{border-color:var(--text);color:var(--text)}
.trophy{font-size:5rem;animation:tbounce2 1.1s ease-in-out infinite}
@keyframes tbounce2{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-14px) rotate(4deg)}}
.wtitle{font-size:2rem;font-weight:900;text-align:center}
.wsub{font-size:.84rem;color:var(--muted);text-align:center}
.ranks{width:100%;display:flex;flex-direction:column;gap:7px}
.rrow{display:flex;justify-content:space-between;align-items:center;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
.rpos{font-size:1.2rem}.rname{font-weight:800}.rdet{font-size:.7rem;color:var(--muted)}

/* ── STATS ── */
#stats{padding-top:32px;gap:14px}
.stbl{width:100%;border-collapse:collapse}
.stbl th{font-size:.62rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:7px 10px;text-align:left;font-weight:800}
.stbl td{padding:9px 10px;border-top:1px solid var(--border);font-size:.85rem}
.stbl tr:hover td{background:var(--card2)}

/* ── MODAL ── */
.ov{display:none;position:fixed;inset:0;background:rgba(20,10,50,.75);backdrop-filter:blur(7px);align-items:center;justify-content:center;z-index:100}
.ov.on{display:flex;animation:fIn .2s ease}
.modal{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:26px 20px;max-width:290px;width:88%;display:flex;flex-direction:column;gap:11px;text-align:center;animation:wIn .28s cubic-bezier(.34,1.56,.64,1)}
.modal h2{font-size:1.25rem;font-weight:900}.modal p{font-size:.83rem;color:var(--muted);line-height:1.5}

/* ── CONFETTI ── */
.cf{position:fixed;border-radius:2px;pointer-events:none;z-index:300;animation:cfall 1.8s ease-in forwards}
@keyframes cfall{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(720deg);opacity:0}}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--text);color:#fff;padding:8px 18px;border-radius:100px;font-size:.8rem;font-weight:800;z-index:200;pointer-events:none;transition:transform .32s cubic-bezier(.34,1.56,.64,1);white-space:nowrap;box-shadow:var(--shadow-md)}
#toast.on{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu" class="scr on">
  <div><div class="logo-t">LUDO</div><div class="logo-s">✦ Classic Edition ✦</div></div>
  <div class="card">
    <div class="sec">Game Mode</div>
    <div class="mode-grid">
      <div class="mcard sel" id="mLocal" onclick="selMode('local')"><div class="mi">👥</div><h3>Pass & Play</h3><p>Same device</p></div>
      <div class="mcard" id="mAI" onclick="selMode('ai')"><div class="mi">🤖</div><h3>vs AI</h3><p>Computer opponent</p></div>
    </div>
    <div class="sec">Number of Players</div>
    <div class="chips" id="cntChips">
      <button class="chip" onclick="selCnt(2)">2</button>
      <button class="chip sel" onclick="selCnt(3)">3</button>
      <button class="chip" onclick="selCnt(4)">4</button>
    </div>
    <div class="sec">AI Difficulty</div>
    <div class="chips" id="diffChips">
      <button class="chip sel" onclick="selDiff('easy')">Easy</button>
      <button class="chip" onclick="selDiff('medium')">Medium</button>
      <button class="chip" onclick="selDiff('hard')">Hard</button>
    </div>
    <button class="go" onclick="startGame()">▶  Start Game</button>
    <div style="text-align:center"><button class="lnk" onclick="showScr('stats')">📊 Statistics</button></div>
  </div>
</div>

<!-- GAME -->
<div id="game" class="scr">
  <div class="topbar">
    <div class="ibtn" onclick="confirmQuit()">←</div>
    <span class="gtitle">🎲 LUDO</span>
    <div class="ibtn" id="sndBtn" onclick="togSound()">🔊</div>
  </div>
  <!-- Top player panels: Red (left), Blue (right) -->
  <div class="prow" id="prow-top"></div>
  <!-- Status pill -->
  <div class="spill" id="spill">
    <div class="sdot" id="sdot"></div>
    <span id="sturn">–</span>
    <span class="smsg" id="smsg">Roll the dice!</span>
  </div>
  <!-- Board -->
  <div class="bwrap">
    <div class="board" id="board">
      <div class="bgrid" id="bgrid"></div>
      <div id="tlayer"></div>
    </div>
  </div>
  <!-- Bottom player panels: Yellow (left), Green (right) -->
  <div class="prow" id="prow-bot"></div>
</div>

<!-- STATS -->
<div id="stats" class="scr">
  <h2 style="font-size:1.6rem;font-weight:900">Statistics</h2>
  <div id="statsBody" style="width:100%"></div>
  <button class="lnk" onclick="showScr('menu')">← Back</button>
</div>

<!-- WIN OVERLAY -->
<div class="wov" id="wov">
  <div class="wcard">
    <div class="xbtn" onclick="closeWin()">✕</div>
    <div class="trophy" id="wtrophy">🏆</div>
    <div class="wtitle" id="wtitle"></div>
    <div class="wsub" id="wsub"></div>
    <div class="ranks" id="wranks"></div>
    <button class="go" onclick="closeWin()">✕ Close & Go Home</button>
  </div>
</div>

<!-- MODAL -->
<div class="ov" id="modal">
  <div class="modal">
    <h2 id="mtitle">Quit?</h2>
    <p id="mmsg">Progress will be lost.</p>
    <button class="go" id="mok" onclick="mOk()">Confirm</button>
    <button class="lnk" onclick="closeModal()" style="margin-top:4px">Cancel</button>
  </div>
</div>

/* ── AUDIO ── */
let _rollBuf=null,_stepBuf=null,_actx=null,sndOn=true;
function gACtx(){return _actx||(_actx=new(window.AudioContext||window.webkitAudioContext)())}
async function preloadAudio(){
  const ctx=gACtx();
  const load=async src=>{try{const r=await fetch(src);const ab=await r.arrayBuffer();return ctx.decodeAudioData(ab)}catch{return null}};
  _rollBuf=await load(_ROLL_SRC);_stepBuf=await load(_STEP_SRC);
}
function playBuf(buf,vol=1){
  if(!buf)return;
  try{const ctx=gACtx();const s=ctx.createBufferSource();const g=ctx.createGain();g.gain.value=vol;s.buffer=buf;s.connect(g);g.connect(ctx.destination);s.start()}catch{}
}
function snd(t){
  if(!sndOn)return;
  try{
    const c=gACtx(),n=c.currentTime;
    if(t==='roll')playBuf(_rollBuf,.85);
    else if(t==='step')playBuf(_stepBuf,.7);
    else if(t==='capture'){
      const o=c.createOscillator(),g=c.createGain();o.type='sawtooth';
      o.frequency.setValueAtTime(600,n);o.frequency.exponentialRampToValueAtTime(80,n+.4);
      g.gain.setValueAtTime(.2,n);g.gain.linearRampToValueAtTime(0,n+.45);
      o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.5);
    }else if(t==='enter'){
      [520,780].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;
        g.gain.setValueAtTime(.12-i*.03,n+i*.04);g.gain.exponentialRampToValueAtTime(.001,n+.35);
        o.connect(g);g.connect(c.destination);o.start(n+i*.04);o.stop(n+.5);});
    }else if(t==='finish'){
      [500,630,800,1000].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;
        g.gain.setValueAtTime(.16,n+i*.08);g.gain.exponentialRampToValueAtTime(.001,n+i*.08+.35);
        o.connect(g);g.connect(c.destination);o.start(n+i*.08);o.stop(n+i*.08+.4);});
    }else if(t==='blocked'){
      const o=c.createOscillator(),g=c.createGain();o.type='square';o.frequency.value=180;
      g.gain.setValueAtTime(.1,n);g.gain.linearRampToValueAtTime(0,n+.22);
      o.connect(g);g.connect(c.destination);o.start(n);o.stop(n+.25);
    }
  }catch{}
}
function togSound(){sndOn=!sndOn;document.getElementById('sndBtn').textContent=sndOn?'🔊':'🔇'}

/* ── GAME STATE ── */
let G=null;
function newG(np,mode,diff){
  const cols=COLORS.slice(0,np);
  const toks={};
  cols.forEach(c=>{toks[c]=Array.from({length:4},(_,i)=>({id:i,color:c,state:'home',pi:-1,hi:-1}))});
  return{np,mode,diff,cols,toks,cur:0,dice:null,rolled:false,moveable:[],finished:[],turns:0,animating:false,
    aiCols:mode==='ai'?COLORS.slice(1,np):[]};
}

/* ── START GAME ── */
function startGame(){
  G=newG(mCnt,mMode,mDiff);
  showScr('game');
  preloadAudio();
  buildBoard();
  createTokenEls();
  renderPanels();
  requestAnimationFrame(()=>{
    initTokenPos();
    updateStatus();
    updatePanels();
    checkAI();
  });
}

function buildBoard(){

  // Build metadata map
  const meta=Array.from({length:15},()=>Array(15).fill(null));

  // Home zones
  [[0,5,0,5,'r'],[0,5,9,14,'b'],[9,14,9,14,'g'],[9,14,0,5,'y']].forEach(([r1,r2,c1,c2,t])=>{
    for(let r=r1;r<=r2;r++) for(let c=c1;c<=c2;c++) meta[r][c]={type:'home',color:t};
  });

  // Path cells
  PATH.forEach(([r,c],i)=>{ meta[r][c]={type:'path',idx:i}; });

  // Home columns
  Object.entries(HC).forEach(([col,cells])=>{
    cells.forEach(([r,c])=>{ meta[r][c]={type:'hc',color:col}; });
  });

  // Center 3×3
  for(let r=6;r<=8;r++) for(let c=6;c<=8;c++) meta[r][c]={type:'cen',r,c};

  // Inner home rectangle (lighter overlay) — rows/cols 1-4 relative to zone
  const innerZones=[
    {r1:1,r2:4,c1:1,c2:4},{r1:1,r2:4,c1:10,c2:13},
    {r1:10,r2:13,c1:10,c2:13},{r1:10,r2:13,c1:1,c2:4}
  ];

  for(let r=0;r<15;r++){
    for(let c=0;c<15;c++){
      const el=document.createElement('div');
      el.className='bc';el.id=`bc${r}-${c}`;
      const m=meta[r][c];

      if(!m){
        el.classList.add((r+c)%2===0?'pn':'pa');
      } else if(m.type==='home'){
        el.classList.add('z'+m.color);
        // Inner lighter rectangle?
        const iz=innerZones.find(z=>r>=z.r1&&r<=z.r2&&c>=z.c1&&c<=z.c2);
        if(iz) el.classList.add('hb-inner');
        // Token slot circle?
        const col={r:'red',b:'blue',g:'green',y:'yellow'}[m.color];
        if(col && HB[col].some(([hr,hc])=>hr===r&&hc===c)) el.classList.add('hb-slot');
      } else if(m.type==='path'){
        const i=m.idx;
        const startEntry=Object.entries(START).find(([,v])=>v===i);
        if(startEntry){
          const cs={red:'psr',blue:'psb',green:'psg',yellow:'psy'};
          el.classList.add(cs[startEntry[0]]);
        } else if(REST_SAFE.has(i)){
          el.classList.add('psafe');
        } else {
          el.classList.add((r+c)%2===0?'pn':'pa');
        }
      } else if(m.type==='hc'){
        const cs={red:'hcr',blue:'hcb',green:'hcg',yellow:'hcy'};
        el.classList.add(cs[m.color]);
      } else if(m.type==='cen'){
        if(r===7&&c===7){el.classList.add('zcen');el.textContent='🏠';el.style.fontSize='1.4rem'}
        else{
          const map={'6-6':'zcen-r','6-7':'zcen-b','6-8':'zcen-b','7-6':'zcen-r','7-8':'zcen-g','8-6':'zcen-y','8-7':'zcen-g','8-8':'zcen-g'};
          el.classList.add(map[`${r}-${c}`]||'pn');
        }
      }
      grid.appendChild(el);
    }
  }
}

/* ── TOKEN ELEMENTS ── */
function createTokenEls(){
  const layer=document.getElementById('tlayer');layer.innerHTML='';
  G.cols.forEach(col=>{
    G.toks[col].forEach(tok=>{
      const el=document.createElement('div');
      el.id=`tok-${col}-${tok.id}`;
      el.className=`token tk${col[0]}`;
      el.textContent=tok.id+1;
      el.style.display='none';
      layer.appendChild(el);
    });
  });
}

function initTokenPos(){G.cols.forEach(col=>G.toks[col].forEach(tok=>updateTokEl(tok)))}

function tokRC(tok){
  if(tok.state==='home') return HB[tok.color][tok.id];
  if(tok.state==='path') return PATH[tok.pi];
  if(tok.state==='homecol'||tok.state==='done') return HC[tok.color][Math.min(tok.hi,5)];
  return[7,7];
}
function doneOffset(tok){
  const base=HC[tok.color][5];const off=DONE_OFF[tok.id];
  return[base[0]+off[0],base[1]+off[1]];
}
function updateTokEl(tok){
  const el=document.getElementById(`tok-${tok.color}-${tok.id}`);if(!el)return;
  const b=document.getElementById('board');
  const cw=b.offsetWidth/15,ch=b.offsetHeight/15;
  let r,c;
  if(tok.state==='done'){[r,c]=doneOffset(tok);}else{[r,c]=tokRC(tok);}
  const sz=cw*.74;
  el.style.width=sz+'px';el.style.height=sz+'px';el.style.fontSize=(sz*.38)+'px';
  el.style.left=(c*cw+cw*.13)+'px';el.style.top=(r*ch+ch*.13)+'px';
  el.style.display='flex';el.style.zIndex='5';
  el.classList.toggle('done-glow',tok.state==='done');
  el.style.opacity=tok.state==='done'?'.88':'1';
  el.classList.remove('movable');el.style.pointerEvents='none';el.onclick=null;
}
function setMovable(list){
  G.cols.forEach(col=>G.toks[col].forEach(tok=>{
    const el=document.getElementById(`tok-${col}-${tok.id}`);
    if(el){el.classList.remove('movable');el.style.pointerEvents='none';el.onclick=null;}
  }));
  list.forEach(tok=>{
    const el=document.getElementById(`tok-${tok.color}-${tok.id}`);
    if(el&&tok.state!=='done'){el.classList.add('movable');el.style.pointerEvents='all';el.onclick=()=>doMove(tok.color,tok.id);}
  });
}

/* ── PLAYER PANELS ── */
// Top: Red (left), Blue (right)
// Bottom: Yellow (left), Green (right)
const TOP_COLS=['red','blue'];
const BOT_COLS=['yellow','green'];

function buildPBox(col){
  const box=document.createElement('div');
  box.className='pbox';box.id=`pbox-${col}`;
  const isAI=G.aiCols.includes(col);
  const cc={red:'var(--red)',blue:'var(--blue)',green:'var(--green)',yellow:'var(--yellow)'};
  box.innerHTML=`
    <div class="die-sm" id="die-${col}" onclick="tryRoll('${col}')">
      <div class="dot d1"></div><div class="dot d2"></div><div class="dot d3"></div>
      <div class="dot d4"></div><div class="dot d5"></div><div class="dot d6"></div>
      <div class="dot d7"></div><div class="dot d8"></div><div class="dot d9"></div>
    </div>
    <div class="px-info">
      <div class="px-name" style="color:${cc[col]}">${EMO[col]} ${CNAME[col]}${isAI?' 🤖':''}</div>
      <div class="px-score" id="pscore-${col}">0/4 home</div>
    </div>
    <button class="px-roll" id="rbtn-${col}" onclick="tryRoll('${col}')" disabled
      style="background:${cc[col]};color:${col==='yellow'?'#5a3800':'#fff'}">ROLL</button>`;
  return box;
}

function renderPanels(){
  const topRow=document.getElementById('prow-top');
  const botRow=document.getElementById('prow-bot');
  topRow.innerHTML=''; botRow.innerHTML='';

  TOP_COLS.forEach(col=>{
    if(G.cols.includes(col)) topRow.appendChild(buildPBox(col));
    else topRow.appendChild(document.createElement('div'));
  });

  const botPlaying=BOT_COLS.filter(c=>G.cols.includes(c));
  if(botPlaying.length){
    botRow.style.display='grid';
    BOT_COLS.forEach(col=>{
      if(G.cols.includes(col)) botRow.appendChild(buildPBox(col));
      else botRow.appendChild(document.createElement('div'));
    });
  } else {
    botRow.style.display='none';
  }
}

function updatePanels(){
  const curCol=G.cols[G.cur];
  G.cols.forEach(col=>{
    const box=document.getElementById(`pbox-${col}`);if(!box)return;
    const isActive=col===curCol;
    const isFinished=G.finished.includes(col);
    const done=G.toks[col].filter(t=>t.state==='done').length;
    const cc={red:'var(--red)',blue:'var(--blue)',green:'var(--green)',yellow:'var(--yellow)'};

    box.classList.toggle('active',isActive);
    box.classList.toggle('finished',isFinished);
    box.style.borderColor=isActive?`var(--${col})`:isFinished?'#ddd':'';
    box.style.background=isActive?`var(--${col}-t)`:'';

    const sc=document.getElementById(`pscore-${col}`);
    if(sc) sc.textContent=isFinished?'✅ Finished':`${done}/4 home`;

    const btn=document.getElementById(`rbtn-${col}`);
    if(btn){
      btn.disabled=!isActive||isFinished||G.rolled||G.animating;
      btn.textContent=isFinished?'👑':'ROLL';
    }
  });
}

/* ── STATUS ── */
function updateStatus(msg){
  const col=G.cols[G.cur];const ai=G.aiCols.includes(col);
  document.getElementById('sdot').style.background=`var(--${col})`;
  document.getElementById('sturn').textContent=`${CNAME[col]}${ai?' (AI)':''}'s Turn`;
  document.getElementById('smsg').textContent=msg||'Roll the dice!';
  document.getElementById('spill').style.borderColor=`var(--${col})`;
}

/* ── DIE ── */
function setDiceFace(col,n){
  const d=document.getElementById(`die-${col}`);if(!d)return;
  // Keep only 'die-sm' base class, add face-N
  d.className=`die-sm${n>=1&&n<=6?' face-'+n:''}`;
}

function addDiceSnap(col){
  const d=document.getElementById(`die-${col}`);if(!d)return;
  d.classList.add('snap');
  setTimeout(()=>d.classList.remove('snap'),220);
}

/* ── ROLL ── */
function fairRoll(){const a=new Uint32Array(1);crypto.getRandomValues(a);return(a[0]%6)+1}

function tryRoll(col){
  if(!G||G.rolled||G.animating)return;
  if(G.cols[G.cur]!==col)return;
  if(G.aiCols.includes(col))return;
  execRoll(col);
}

function execRoll(col){
  G.rolled=true;
  // Disable all roll buttons during animation
  G.cols.forEach(c=>{const b=document.getElementById(`rbtn-${c}`);if(b)b.disabled=true;});

  const val=fairRoll();G.dice=val;
  addDiceSnap(col);
  setDiceFace(col,val);
  snd('roll');
  afterRoll(col,val);
}

function afterRoll(col,val){
  const mov=getMovable(col,val);G.moveable=mov;
  const ai=G.aiCols.includes(col);
  if(mov.length===0){
    updateStatus(`Rolled ${val} — no moves!`);snd('blocked');setTimeout(nextTurn,1100);
  } else if(mov.length===1||(ai&&mov.length>0)){
    updateStatus(`Rolled ${val}!`);setMovable([]);
    const chosen=ai?aiPick(col,mov,val):mov[0];
    setTimeout(()=>doMove(chosen.color,chosen.id),ai?650:350);
  } else {
    updateStatus(`Rolled ${val} — tap a token!`);setMovable(mov);
  }
}

/* ── MOVEMENT (FIXED) ── */
// relStep: how many steps a token has moved from its starting position
function relStep(col,pi){return(pi-START[col]+52)%52}

// getMovable: returns tokens that CAN move given dice value
// KEY FIX: tokens enter home col after relStep=50 (not 51)
// getMovable: nr<=50 means still on path; nr=51..56 means hi=0..5 in home col
function getMovable(col,dice){
  return G.toks[col].filter(tok=>{
    if(tok.state==='done') return false;
    if(tok.state==='home') return dice===6;
    if(tok.state==='path'){
      const rel=relStep(col,tok.pi);
      const nr=rel+dice;
      if(nr<=50) return true;          // lands on path cell
      return (nr-51)<=5;               // enters home col (hi=0..5)
    }
    if(tok.state==='homecol') return tok.hi+dice<=5;
    return false;
  });
}

// stepTok: advance token ONE step
// KEY FIX: transition to home col when relStep >= 50 (was 51)
function stepTok(tok){
  if(tok.state==='path'){
    const rel=relStep(tok.color,tok.pi);
    if(rel>=50){
      // Enter home column — first cell is hi=0
      tok.state='homecol';tok.hi=0;
    } else {
      tok.pi=(tok.pi+1)%52;
    }
    return false;
  }
  if(tok.state==='homecol'){
    tok.hi++;
    if(tok.hi>=6){tok.hi=5;tok.state='done';return true;}
    return false;
  }
  return true;
}

const STEP_MS=125;
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

async function animateTok(tok,dice){
  if(tok.state==='home'){
    tok.state='path';tok.pi=START[tok.color];
    updateTokEl(tok);snd('enter');await sleep(220);return;
  }
  let steps=dice;
  while(steps>0){
    const fin=stepTok(tok);
    updateTokEl(tok);snd('step');
    if(fin)break;
    steps--;
    if(steps>0)await sleep(STEP_MS);
  }
  await sleep(60);
}

/* ── DO MOVE ── */
async function doMove(col,id){
  if(!G||G.animating)return;
  const tok=G.toks[col].find(t=>t.id===id);
  if(!tok||!G.moveable.some(t=>t.color===col&&t.id===id))return;

  G.animating=true;G.moveable=[];setMovable([]);
  const dice=G.dice;
  await animateTok(tok,dice);

  let bonus=(dice===6);

  // Check capture
  if(tok.state==='path'){
    const pi=tok.pi;
    if(!ALL_SAFE.has(pi)){
      G.cols.forEach(oc=>{if(oc===col)return;
        G.toks[oc].forEach(ot=>{
          if(ot.state==='path'&&ot.pi===pi){
            ot.state='home';ot.pi=-1;updateTokEl(ot);
            bonus=true;snd('capture');
            toast(`${EMO[col]} captured ${EMO[oc]}!`);
          }
        });
      });
    }
  }

  // Check if token reached center
  if(tok.state==='done'){
    snd('finish');
    const doneCount=G.toks[col].filter(t=>t.state==='done').length;
    if(doneCount===4){
      // All 4 tokens home — player finishes
      G.finished.push(col);
      showCrown(col,G.finished.length);
      updatePanels();

      // Check if game should end
      const remaining=G.cols.filter(c=>!G.finished.includes(c));
      if(remaining.length<=1){
        // Last player gets auto-placed last — no need to play
        if(remaining.length===1) G.finished.push(remaining[0]);
        G.animating=false;
        setTimeout(showWinOver,700);
        return;
      }
      // Player is done — move to next turn immediately (no bonus)
      G.animating=false;G.rolled=false;
      setTimeout(nextTurn,400);
      return;
    }
    // Only 1-3 tokens home — bonus roll for reaching center
    bonus=true;
  }

  updatePanels();
  G.animating=false;G.rolled=false;

  if(bonus){
    updateStatus('🎉 Bonus roll!');updatePanels();checkAI();
  } else {
    setTimeout(nextTurn,150);
  }
}

/* ── NEXT TURN ── */
function nextTurn(){
  G.rolled=false;G.dice=null;G.moveable=[];G.turns++;
  // Reset die face for all players (show blank)
  G.cols.forEach(c=>setDiceFace(c,0));
  // Advance to next non-finished player
  let nxt=(G.cur+1)%G.np,t=0;
  while(G.finished.includes(G.cols[nxt])&&t<G.np){nxt=(nxt+1)%G.np;t++;}
  G.cur=nxt;
  setMovable([]);
  updateStatus();
  updatePanels();
  checkAI();
}

/* ── CROWN BADGE ── */
function showCrown(col,pos){
  // Fade out done tokens
  G.toks[col].forEach(tok=>{
    const el=document.getElementById(`tok-${col}-${tok.id}`);
    if(el){el.style.transition='opacity .5s,transform .5s';el.style.opacity='0';el.style.transform='scale(0)';
      setTimeout(()=>{el.style.display='none'},500);}
  });
  const board=document.getElementById('board');
  const bw=board.offsetWidth,bh=board.offsetHeight,cw=bw/15,ch=bh/15;
  // Crown at center of home zone
  const hCenters={red:{r:2.5,c:2.5},blue:{r:2.5,c:11.5},green:{r:11.5,c:11.5},yellow:{r:11.5,c:2.5}};
  const hc=hCenters[col];
  const badge=document.createElement('div');badge.id=`crown-${col}`;badge.className='cbadge';
  badge.style.left=(hc.c*cw)+'px';badge.style.top=(hc.r*ch)+'px';
  const sizes=['3.4rem','2.5rem','1.9rem','1.4rem'];
  const labels=['1ST','2ND','3RD','4TH'];
  const golds=['#ffd700','#b0b0b0','#cd7f32','#999'];
  badge.innerHTML=`<div style="font-size:${sizes[pos-1]};line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))">👑</div><div class="crank" style="color:${golds[pos-1]}">${labels[pos-1]}</div>`;
  board.appendChild(badge);
  const medals=['🥇','🥈','🥉','4️⃣'];
  toast(`${EMO[col]} ${CNAME[col]} finished ${medals[pos-1]}!`);
}

/* ── WIN OVERLAY ── */
function showWinOver(){
  saveStats();confettiBurst();
  const w=G.finished[0];
  document.getElementById('wtrophy').textContent=EMO[w]+'🏆';
  document.getElementById('wtitle').textContent=`${CNAME[w]} Wins!`;
  document.getElementById('wtitle').style.color=`var(--${w})`;
  document.getElementById('wsub').textContent=`Game finished in ${G.turns} turns`;
  const ranks=document.getElementById('wranks');ranks.innerHTML='';
  const medals=['🥇','🥈','🥉','4️⃣'];
  G.finished.forEach((col,i)=>{
    const row=document.createElement('div');row.className='rrow';
    const done=G.toks[col].filter(t=>t.state==='done').length;
    row.innerHTML=`<div class="rpos">${medals[i]||i+1}</div><div class="rname" style="color:var(--${col})">${EMO[col]} ${CNAME[col]}</div><div class="rdet">${done}/4 home</div>`;
    ranks.appendChild(row);
  });
  document.getElementById('wov').classList.add('on');
}
function closeWin(){document.getElementById('wov').classList.remove('on');G=null;showScr('menu')}

function confettiBurst(){
  const cols=['#e53935','#1e88e5','#43a047','#f9a825','#9c27b0','#fff'];
  for(let i=0;i<65;i++){
    const p=document.createElement('div');p.className='cf';
    p.style.cssText=`left:${Math.random()*100}vw;top:0;background:${cols[Math.floor(Math.random()*cols.length)]};width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;animation-delay:${Math.random()*.9}s;animation-duration:${1.3+Math.random()*1.1}s`;
    document.body.appendChild(p);setTimeout(()=>p.remove(),3200);
  }
}

/* ── AI ── */
function checkAI(){
  if(!G||G.rolled||G.animating)return;
  const col=G.cols[G.cur];
  if(!G.aiCols.includes(col))return;
  setTimeout(()=>aiTurn(col),750);
}
function aiTurn(col){if(!G||G.cols[G.cur]!==col||G.rolled||G.animating)return;execRoll(col)}
function aiPick(col,mov,dice){
  if(G.diff==='easy') return mov[Math.floor(Math.random()*mov.length)];
  let best=null,bs=-Infinity;
  mov.forEach(t=>{
    let s=0;
    if(t.state==='home') s+=25;
    if(t.state==='homecol') s+=18;
    if(t.state==='path'){
      s+=8;
      const rel=relStep(col,t.pi);const nr=rel+dice;
      if(nr<=50){
        const ni=t.pi+dice<52?t.pi+dice:(t.pi+dice)%52;
        G.cols.forEach(oc=>{if(oc===col)return;
          if(G.toks[oc].some(o=>o.state==='path'&&o.pi===ni&&!ALL_SAFE.has(ni))) s+=55;
        });
        if(ALL_SAFE.has(ni)) s+=6;
      } else s+=15; // entering home col is good
    }
    if(s>bs){bs=s;best=t;}
  });
  return best||mov[0];
}

/* ── STATS ── */
let appStats=(()=>{try{return JSON.parse(localStorage.getItem('ludo5_s')||'{"games":[],"wins":{}}')}catch{return{games:[],wins:{}}}})();
function saveStats(){const w=G.finished[0];appStats.wins[w]=(appStats.wins[w]||0)+1;appStats.games.push({w,turns:G.turns,mode:G.mode,date:Date.now()});if(appStats.games.length>50)appStats.games=appStats.games.slice(-50);try{localStorage.setItem('ludo5_s',JSON.stringify(appStats))}catch{}}
function renderStats(){
  const el=document.getElementById('statsBody'),tot=appStats.games.length;
  if(!tot){el.innerHTML='<p style="color:var(--muted);text-align:center;padding:24px">No games yet!</p>';return}
  el.innerHTML=`<p style="color:var(--muted);font-size:.83rem;margin-bottom:10px">Total games: <b style="color:var(--text)">${tot}</b></p>
  <table class="stbl"><tr><th>Color</th><th>Wins</th><th>Win %</th></tr>
  ${COLORS.map(c=>`<tr><td style="color:var(--${c})">${EMO[c]} ${CNAME[c]}</td><td>${appStats.wins[c]||0}</td><td>${Math.round(((appStats.wins[c]||0)/tot)*100)}%</td></tr>`).join('')}
  </table><p style="color:var(--muted);font-size:.83rem;margin-top:18px;margin-bottom:8px">Recent Games</p>
  <table class="stbl"><tr><th>Winner</th><th>Turns</th><th>Mode</th></tr>
  ${appStats.games.slice(-8).reverse().map(g=>`<tr><td style="color:var(--${g.w})">${EMO[g.w]} ${CNAME[g.w]}</td><td>${g.turns}</td><td>${g.mode}</td></tr>`).join('')}
  </table>`;
}

/* ── SCREENS & HELPERS ── */
function showScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='stats')renderStats();
  if(id==='game')requestAnimationFrame(()=>{if(G){initTokenPos();updatePanels();}});
}

let toastT;
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2200)}

let mOkFn=()=>{};
function confirmQuit(){
  document.getElementById('mtitle').textContent='Quit Game?';
  document.getElementById('mmsg').textContent='Your current game will be lost.';
  document.getElementById('mok').textContent='Quit';
  mOkFn=()=>{closeModal();document.getElementById('wov').classList.remove('on');G=null;showScr('menu')};
  document.getElementById('modal').classList.add('on');
}
function mOk(){mOkFn()}
function closeModal(){document.getElementById('modal').classList.remove('on')}

let resT;
window.addEventListener('resize',()=>{clearTimeout(resT);resT=setTimeout(()=>{if(G)initTokenPos();},100)});
